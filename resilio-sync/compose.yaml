services:
  resilio-sync:
    image: lscr.io/linuxserver/resilio-sync:latest
    container_name: resilio-sync
    user: "${PUID}:${PGID}"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      - ${SSD}/data/resilio-sync/downloads:/downloads
      - ${DATA_PATH}/resilio-sync/sync:/sync
    ports:
      - 8888:8888
      - 55555:55555
    networks:
      - default
      - resilio-sync_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resilio-sync.rule=Host(`resilio-sync.srv.kllnr.de`)"
      - "traefik.http.routers.resilio-sync.entrypoints=websecure"
      - "traefik.http.routers.resilio-sync.tls.certresolver=dns_certresolver"
    restart: unless-stopped

networks:
  resilio-sync_proxy:
    external: true
