services:
  resilio-sync:
    image: lscr.io/linuxserver/resilio-sync:latest
    container_name: resilio-sync
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run
    environment:
      # linuxserver.io images are not compatible with user: in Compose. 
      # They handle user remapping themselves via PUID/PGID environment variables — but only if the container starts as root and s6 performs the drop.
      # https://docs.linuxserver.io/misc/non-root/
      PUID: ${PUID:-3000}
      PGID: ${PGID:-3000}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./config:/config
      - ${DATA_PATH:-./downloads}/downloads:/downloads
      - ${DATA_PATH:-./sync}/sync:/sync
    ports:
      - "55555:55555"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resilio-sync.rule=Host(`${DOMAIN:-resilio-sync.localhost}`)"
      - "traefik.http.routers.resilio-sync.entrypoints=websecure"
      - "traefik.http.routers.resilio-sync.${TRAEFIK_SERVICES_TLS_CONFIG:-tls.certresolver=dns_certresolver}"
      - "traefik.http.services.resilio-sync.loadbalancer.server.port=8888"
    restart: unless-stopped

networks:
  proxy:
    external: true
