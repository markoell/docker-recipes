services:
  resilio-sync:
    image: lscr.io/linuxserver/resilio-sync:latest
    container_name: resilio-sync
    user: "${PUID:-3000}:${PGID:-3000}"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./config:/config
      - ${DATA_PATH:-./downloads}/downloads:/downloads
      - ${DATA_PATH:-./sync}/sync:/sync
    ports:
      - "55555:55555"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resilio-sync.rule=Host(`${DOMAIN:-resilio-sync.localhost}`)"
      - "traefik.http.routers.resilio-sync.entrypoints=websecure"
      - "traefik.http.routers.resilio-sync.tls.certresolver=letsencrypt_certresolver"
      - "traefik.http.services.resilio-sync.loadbalancer.server.port=8888"
    restart: unless-stopped

networks:
  proxy:
    external: true
