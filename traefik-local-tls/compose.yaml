services:
    traefik:
        image: "traefik:v3.7"
        container_name: "traefik"
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        networks:
            - proxy
        command:
            - "--api.insecure=false"
            - "--api.dashboard=true"
            - "--log.level=INFO"
            - "--accesslog=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.network=proxy"
            - "--providers.file.directory=/etc/traefik/dynamic"
            - "--entryPoints.web.address=:80"
            - "--entryPoints.websecure.address=:443"
            - "--entryPoints.websecure.http.tls=true"
        ports:
            - "80:80"
            - "443:443"
            - "8080:8080"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
            - "./certs:/certs:ro"
            - "./dynamic:/etc/traefik/dynamic:ro"
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.dashboard.rule=Host(`dashboard.docker.localhost`)"
            - "traefik.http.routers.dashboard.entrypoints=websecure"
            - "traefik.http.routers.dashboard.service=api@internal"
            - "traefik.http.routers.dashboard.tls=true"

    whoami:
        image: "traefik/whoami"
        restart: unless-stopped
        networks:
            - proxy
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.whoami.rule=Host(`whoami.docker.localhost`)"
            - "traefik.http.routers.whoami.entrypoints=websecure"
            - "traefik.http.routers.whoami.tls=true"
    
# New service
    whoami-api:
        image: "traefik/whoami"
        networks:
        - proxy
        container_name: "whoami-api"
        environment:
        - WHOAMI_NAME=API Service
        labels:
        - "traefik.enable=true"
        # Path-based routing
        - "traefik.http.routers.whoami-api.rule=Host(`whoami.docker.localhost`) && PathPrefix(`/api`)"
        - "traefik.http.routers.whoami-api.entrypoints=websecure"
        - "traefik.http.routers.whoami-api.tls=true"

networks:
    proxy:
        name: proxy
